name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite runs in seconds. A job that is still going after this is stuck,
    # not slow -- and it has happened: a prompt test that ran out of input
    # looped forever on click 8.1, which is what Python 3.9 resolves. Better to
    # fail in ten minutes than burn a runner for six hours.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.9.2 is the real floor: cryptography>=46 declares
        # !=3.9.0,!=3.9.1, and ML-KEM does not exist before 46.
        python-version: ["3.9", "3.11", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Report the crypto backend
        # ML-KEM and ML-DSA need cryptography >= 46 on OpenSSL >= 3.5. The
        # wheels bundle their own OpenSSL, so this records what the run actually
        # tested against -- and fails loudly instead of skipping if it is
        # missing.
        run: |
          python -c "import cryptography; print('cryptography', cryptography.__version__)"
          python -c "from cryptography.hazmat.backends.openssl.backend import backend; print(backend.openssl_version_text())"
          python -c "from cryptography.hazmat.primitives.asymmetric.mlkem import MLKEM768PrivateKey; print('ML-KEM-768: available')"
          python -c "from cryptography.hazmat.primitives.asymmetric.mldsa import MLDSA65PrivateKey; print('ML-DSA-65: available')"

      - name: Test
        run: pytest -q

      - name: Smoke-test the installed CLI
        # The unit tests drive click in-process, so they would still pass with
        # a broken console-script entry point. This runs the real binary.
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cd "$work"
          hpqc keygen -o ci
          hpqc keygen -o stranger
          printf 'ci smoke test\n' > msg.txt
          hpqc encrypt -r ci.pub msg.txt -o msg.hpqc
          hpqc info msg.hpqc
          hpqc decrypt -k ci.key msg.hpqc -o out.txt
          cmp msg.txt out.txt
          echo "round trip: ok"
          test "$(stat -c '%a' ci.key)" = "600"
          echo "private key mode 0600: ok"
          # Every negative check below greps the error too. Without that they
          # pass whenever the command fails for *any* reason -- and one of them
          # silently did, when writing to /dev/null started failing before the
          # key was ever looked at.
          if hpqc decrypt -k stranger.key msg.hpqc -o /dev/null 2>err.txt; then
            echo "FAIL: decrypted with the wrong identity"; exit 1
          fi
          grep -q 'encrypted for key id' err.txt
          echo "wrong identity rejected: ok"
          hpqc decrypt -k ci.key msg.hpqc -o /dev/null
          echo "output to a character device: ok"
          printf 'piped\n' | hpqc encrypt -r ci.pub | hpqc decrypt -k ci.key | grep -qx piped
          echo "stdin/stdout pipeline: ok"

          hpqc signgen -o signer
          hpqc signgen -o impostor
          hpqc encrypt -r ci.pub msg.txt -o signed.hpqc -s signer.key
          hpqc decrypt -k ci.key signed.hpqc -o signed-out.txt --sender signer.pub
          cmp msg.txt signed-out.txt
          echo "signed round trip: ok"
          hpqc info signed.hpqc | grep -q '^signed:      yes'
          hpqc info msg.hpqc    | grep -q '^signed:      no'
          echo "info reports the signed flag: ok"
          if hpqc decrypt -k ci.key signed.hpqc -o /dev/null --sender impostor.pub 2>err.txt; then
            echo "FAIL: verified against the wrong sender"; exit 1
          fi
          grep -q 'but verification was requested against' err.txt
          echo "wrong sender rejected: ok"
          if hpqc decrypt -k ci.key msg.hpqc -o /dev/null --sender signer.pub 2>err.txt; then
            echo "FAIL: an unsigned file passed verification"; exit 1
          fi
          grep -q 'this file is not signed' err.txt
          echo "unsigned file fails closed: ok"
          # stdout is the plaintext; the signature notice must go to stderr, or
          # `hpqc decrypt > file` silently gains a status line.
          hpqc decrypt -k ci.key signed.hpqc --sender signer.pub 2>/dev/null > piped-out.txt
          cmp msg.txt piped-out.txt
          echo "signature notice stays off stdout: ok"

          # A low scrypt cost: the default is ~128 MiB and a third of a second
          # by design, and the parameters live in the file, so turning them down
          # here exercises exactly the same code path.
          printf 'correct horse battery staple' > pw
          printf 'a different passphrase' > pw2
          hpqc keygen -o locked --passphrase-file pw --scrypt-log-n 14
          hpqc info locked.key | grep -q 'wrapped private key'
          hpqc info locked.key | grep -q 'unavailable without the passphrase'
          echo "wrapped key described without the passphrase: ok"
          hpqc encrypt -r locked.pub msg.txt -o locked.hpqc
          hpqc decrypt -k locked.key locked.hpqc -o locked-out.txt --passphrase-file pw
          cmp msg.txt locked-out.txt
          echo "passphrase-protected round trip: ok"
          if hpqc decrypt -k locked.key locked.hpqc -o /dev/null --passphrase-file pw2 2>err.txt; then
            echo "FAIL: opened with the wrong passphrase"; exit 1
          fi
          grep -q 'wrong passphrase' err.txt
          echo "wrong passphrase rejected: ok"
          if hpqc decrypt -k locked.key locked.hpqc -o /dev/null 2>err.txt; then
            echo "FAIL: opened a protected key with no passphrase"; exit 1
          fi
          grep -q 'no terminal' err.txt
          echo "missing passphrase refused: ok"
          before="$(hpqc info locked.pub | grep 'key id')"
          hpqc passwd locked.key --passphrase-file pw --new-passphrase-file pw2 --scrypt-log-n 14
          hpqc decrypt -k locked.key locked.hpqc -o rekeyed.txt --passphrase-file pw2
          cmp msg.txt rekeyed.txt
          test "$(hpqc info locked.pub | grep 'key id')" = "$before"
          echo "passwd changed the passphrase, not the identity: ok"
          hpqc passwd locked.key --remove --passphrase-file pw2
          hpqc decrypt -k locked.key locked.hpqc -o unlocked.txt
          cmp msg.txt unlocked.txt
          test "$(stat -c '%a' locked.key)" = "600"
          echo "passwd --remove: ok"

          # Streaming. The format switch is automatic, so this also checks that
          # an ordinary small message is still written the way it always was.
          head -c 3000000 /dev/urandom > big.bin
          hpqc encrypt -r ci.pub big.bin -o big.hpqc
          hpqc info big.hpqc | grep -q '^chunked:     yes'
          hpqc info msg.hpqc | grep -q '^chunked:     no'
          echo "automatic chunking above the threshold: ok"
          hpqc decrypt -k ci.key big.hpqc -o big-out.bin
          cmp big.bin big-out.bin
          echo "streamed round trip: ok"
          test "$(stat -c '%a' big-out.bin)" = "600"
          echo "decrypted plaintext is not world-readable: ok"

          # Remove one whole chunk from the end. Every remaining chunk is a
          # genuine ciphertext, so only the final-chunk marker catches this.
          size="$(stat -c '%s' big.hpqc)"
          head -c "$((size - 65552))" big.hpqc > cut.hpqc
          if hpqc decrypt -k ci.key cut.hpqc -o cut.bin 2>err.txt; then
            echo "FAIL: a truncated stream decrypted"; exit 1
          fi
          grep -q 'authentication failed on chunk' err.txt
          echo "truncation rejected: ok"
          if [ -e cut.bin ]; then
            echo "FAIL: a failed stream left a partial plaintext behind"; exit 1
          fi
          echo "no partial plaintext left behind: ok"

          hpqc encrypt -r ci.pub big.bin -o big-signed.hpqc -s signer.key
          hpqc info big-signed.hpqc | grep -q '^chunked:     no'
          hpqc info big-signed.hpqc | grep -q '^signed:      yes'
          echo "signing a large file falls back to one-shot: ok"

          cat big.bin | hpqc encrypt -r ci.pub | hpqc decrypt -k ci.key > piped-big.bin
          cmp big.bin piped-big.bin
          echo "large stdin/stdout pipeline: ok"

          # Several recipients. The point of the shape is that the file names
          # nobody, so the checks are as much about what is absent as present.
          hpqc keygen -o second
          hpqc keygen -o third
          hpqc encrypt -r ci.pub -r second.pub -r third.pub msg.txt -o group.hpqc
          hpqc info group.hpqc | grep -q '^recipients:  3 (the file does not name them)'
          for who in ci second third; do
            hpqc decrypt -k "$who.key" group.hpqc -o "got-$who.txt"
            cmp msg.txt "got-$who.txt"
          done
          echo "three recipients, three round trips: ok"
          # Hex, not grep: a key id is binary and would never match as text.
          # od rather than xxd, which is not guaranteed to be installed.
          tohex() { od -An -v -tx1 "$1" | tr -d ' \n'; }
          for who in ci second third; do
            id="$(hpqc info "$who.pub" | sed -n 's/^key id: *//p')"
            if tohex group.hpqc | grep -q "$id"; then
              echo "FAIL: $who's key id appears in the container"; exit 1
            fi
          done
          echo "no recipient is named in the file: ok"
          # The same search against the shape that is supposed to contain it,
          # so a broken search cannot make the check above pass for free.
          ci_id="$(hpqc info ci.pub | sed -n 's/^key id: *//p')"
          tohex msg.hpqc | grep -q "$ci_id"
          echo "the single-recipient shape does name its recipient: ok"

          hpqc keygen -o outsider
          if hpqc decrypt -k outsider.key group.hpqc -o /dev/null 2>err.txt; then
            echo "FAIL: an outsider opened a group file"; exit 1
          fi
          grep -q '3 recipient slot' err.txt
          echo "outsider rejected: ok"
          if hpqc encrypt -r ci.pub -r ci.pub msg.txt -o dup.hpqc 2>err.txt; then
            echo "FAIL: the same recipient twice was accepted"; exit 1
          fi
          grep -q 'same key' err.txt
          echo "duplicate recipient refused: ok"
          if hpqc encrypt -r ci.pub -r second.pub msg.txt -o x.hpqc \
               -s signer.key --chunked 2>err.txt; then
            echo "FAIL: signed and chunked at once"; exit 1
          fi
          grep -q 'cannot be combined' err.txt
          echo "signing a chunked list refused: ok"

          hpqc encrypt -r ci.pub --hide-recipients msg.txt -o hidden.hpqc
          hpqc info hidden.hpqc | grep -q '^recipients:  1'
          hpqc decrypt -k ci.key hidden.hpqc -o hidden-out.txt
          cmp msg.txt hidden-out.txt
          echo "one hidden recipient: ok"

          # Both flags at once, streamed, through a pipe on both ends.
          cat big.bin | hpqc encrypt -r ci.pub -r second.pub \
            | hpqc decrypt -k second.key > group-big.bin
          cmp big.bin group-big.bin
          echo "chunked + several recipients through a pipe: ok"
          hpqc encrypt -r ci.pub -r second.pub big.bin -o group-big.hpqc
          hpqc info group-big.hpqc | grep -q '^chunked:     yes'
          hpqc info group-big.hpqc | grep -q '^recipients:  2'
          echo "info reports both shapes at once: ok"

          # Signing to a recipient list. There is no recipient to bind, so the
          # header is bound instead -- every recipient verifies one signature.
          hpqc encrypt -r ci.pub -r second.pub -r third.pub msg.txt \
            -o signed-group.hpqc -s signer.key
          hpqc info signed-group.hpqc | grep -q '^recipients:  3'
          hpqc info signed-group.hpqc | grep -q '^signed:      yes'
          for who in ci second third; do
            hpqc decrypt -k "$who.key" signed-group.hpqc -o "sg-$who.txt" \
              --sender signer.pub 2>"sg-$who.err"
            cmp msg.txt "sg-$who.txt"
            grep -q 'signature ok' "sg-$who.err"
          done
          echo "signed to three recipients, three verifications: ok"
          if hpqc decrypt -k ci.key signed-group.hpqc -o /dev/null \
               --sender impostor.pub 2>err.txt; then
            echo "FAIL: verified a group file against the wrong sender"; exit 1
          fi
          grep -q 'but verification was requested against' err.txt
          echo "wrong sender on a group file rejected: ok"
          if hpqc decrypt -k outsider.key signed-group.hpqc -o /dev/null 2>err.txt; then
            echo "FAIL: an outsider opened a signed group file"; exit 1
          fi
          grep -q 'recipient slot' err.txt
          echo "outsider rejected on a signed group file: ok"
          # The signer is inside the AEAD, so a header-only tool cannot see it.
          signer_id="$(hpqc info signer.pub | sed -n 's/^key id: *//p')"
          if tohex signed-group.hpqc | grep -q "$signer_id"; then
            echo "FAIL: the signer's key id is visible in the container"; exit 1
          fi
          echo "the signer stays confidential: ok"
